<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DETOSPA</title>
<meta name="description" content="H2 ONEST DETOSPA — English · 简体中文 · 繁體中文">
<meta name="theme-color" content="#1e2427">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{--ink:#14181a;--graphite:#1e2427;--on-dark:#eef2f2;--muted:#a9b4b8;--line:#3a4448;--review:#f0b37a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 70% 30%,#2a3236 0%,var(--graphite) 55%,var(--ink) 100%);color:var(--on-dark);font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center}
main{width:100%;max-width:440px;padding-block:48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;justify-items:center;gap:26px;text-align:center}
img{width:150px;height:auto;filter:drop-shadow(0 24px 32px rgba(0,0,0,.45))}
.mark{display:grid;line-height:1}
.mark small{font-weight:500;font-size:10px;letter-spacing:.32em}
.mark span{font-family:"Marcellus",serif;font-size:32px;letter-spacing:.14em}
h1{margin:0;font-weight:400;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px}
h1 span:lang(zh-Hans){font-family:"Noto Sans SC",sans-serif}
h1 span:lang(zh-Hant){font-family:"Noto Sans TC",sans-serif}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;width:100%}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border:1px solid var(--line);border-radius:999px;color:var(--on-dark);text-decoration:none;font-size:17px}
a:lang(zh-Hans){font-family:"Noto Sans SC",sans-serif}
a:lang(zh-Hant){font-family:"Noto Sans TC",sans-serif}
a:hover,a:focus-visible{background:var(--on-dark);color:var(--ink);outline:none}
a small{color:var(--muted);font-size:13px;font-family:"IBM Plex Sans",sans-serif}
a:hover small,a:focus-visible small{color:#5b6569}
a[data-saved]::after{content:"";width:7px;height:7px;border-radius:50%;background:#6f9ea8;margin-left:auto;order:2}
a[data-saved] small{order:3}
.note{font-family:ui-monospace,monospace;font-size:12px;color:var(--review);border:1px solid #6b4a2b;border-radius:4px;padding:6px 10px}
</style>
</head>
<body>
<main id="choose">
  <img src="assets/img/product.webp" width="789" height="978" alt="H2 ONEST DETOSPA">
  <div class="mark"><small>H2 ONEST</small><span>DETOSPA</span></div>
  <h1><span lang="en">Choose your language</span><span lang="zh-Hans">选择语言</span><span lang="zh-Hant">選擇語言</span></h1>
  <ul>
<li><a href="en/" data-lang="en" lang="en" hreflang="en">English</a></li>
<li><a href="zh-hans/" data-lang="zh-hans" lang="zh-Hans" hreflang="zh-Hans">简体中文 <small>Simplified Chinese</small></a></li>
<li><a href="zh-hant/" data-lang="zh-hant" lang="zh-Hant" hreflang="zh-Hant">繁體中文 <small>Traditional Chinese</small></a></li>
  </ul>
</main>
<script>
(function () {
  var KEY = 'detospa-lang', saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var links = document.querySelectorAll('a[data-lang]');
  var target = null;
  links.forEach(function (a) {
    if (a.getAttribute('data-lang') === saved) { a.setAttribute('data-saved', ''); target = a; }
    a.addEventListener('click', function () { try { localStorage.setItem(KEY, a.getAttribute('data-lang')); } catch (e) {} });
  });
  /* Return visitors go straight to the language they chose before.
     No country or IP detection; #choose always shows this screen. */
  if (target && location.hash !== '#choose') location.replace(target.href);
})();
</script>
</body>
</html>
